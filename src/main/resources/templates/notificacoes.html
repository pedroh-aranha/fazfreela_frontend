<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FazFreela - Notificações</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
        }

        .navbar {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .header-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header-section h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 800;
        }
        
        .notification-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .notification-card:hover {
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(40, 50, 70, 0.8);
        }
        
        .unread {
            border-left: 4px solid var(--primary);
            background: rgba(139, 92, 246, 0.1);
        }

        .notification-content h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .notification-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }
        
        .notification-date {
            font-size: 0.8rem;
            color: #64748b;
        }

        .btn-lida {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .btn-lida:hover {
            background: rgba(16, 185, 129, 0.4);
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
        }
        
        .nav-icon-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .badge {
            position: absolute;
            top: -5px;
            right: -10px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <a href="/trabalhos" class="logo" style="text-decoration: none;">FazFreela</a>
            <span style="width: 1px; height: 24px; background: rgba(255,255,255,0.15); display: inline-block;"></span>
            <span style="font-weight: 600; color: #f8fafc; font-size: 0.95rem;">Olá, <span th:text="${session.nome}" style="color: #a78bfa;">Trabalhador</span> 👋</span>
        </div>
        <div class="nav-links" style="display: flex; align-items: center; gap: 1.5rem;">
            <a href="/notificacoes" class="nav-icon-container" style="color: #f8fafc; text-decoration: none; font-size: 1.2rem;">
                🔔 <span class="badge" id="nav-notificacoes-badge" style="display: none;">0</span>
            </a>
            <a href="/trabalhos" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Vagas</a>
            <a href="/meus-trabalhos" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Meus Trabalhos</a>
            <a href="/perfil" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Meu Perfil</a>
            <a href="/logout" style="color: #f87171; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#f87171'">Sair</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Suas Notificações</h1>
        </div>

        <div th:if="${erro}" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-weight: 600;" th:text="${erro}"></div>
        
        <div th:if="${notificacoes == null || notificacoes.empty}" class="empty-state">
            <h2 style="margin-bottom: 1rem; color: var(--text-main);">Você não tem nenhuma notificação!</h2>
            <p>Quando alguém interagir com seus trabalhos ou candidaturas, aparecerá aqui.</p>
        </div>

        <div th:each="notificacao : ${notificacoes}" class="notification-card" th:classappend="${!notificacao.lida} ? 'unread' : ''">
            <div class="notification-content">
                <h3 th:text="${notificacao.titulo}">Título</h3>
                <p th:text="${notificacao.mensagem}">Mensagem...</p>
                <span class="notification-date" th:text="${#temporals.format(notificacao.dataCriacao, 'dd/MM/yyyy HH:mm')}">Data</span>
            </div>
            
            <div th:if="${!notificacao.lida}">
                <form th:action="@{/notificacoes/{id}/lida(id=${notificacao.id})}" method="post" style="margin:0;">
                    <button type="submit" class="btn-lida">Marcar como Lida</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/notificacoes/count')
                .then(response => response.json())
                .then(count => {
                    if (count > 0) {
                        const badge = document.getElementById('nav-notificacoes-badge');
                        badge.innerText = count;
                        badge.style.display = 'block';
                    }
                })
                .catch(error => console.error("Erro ao carregar notificações", error));
        });
    </script>
</body>
</html>
