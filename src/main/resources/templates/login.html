<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FazFreela - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">FazFreela</a>
        <div class="nav-links">
            <a href="/cadastro">Cadastrar</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h1 class="auth-title">Bem-vindo de volta!</h1>
            <p class="auth-subtitle">Acesse sua conta para continuar.</p>

            <div th:if="${erro}" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-weight: 600;" th:text="${erro}"></div>

            <form th:action="@{/login}" method="POST">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="auth-links">
                Não tem uma conta? <a href="/cadastro">Cadastre-se agora</a>
            </div>
        </div>
    </div>

</body>
</html>
