<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - FazFreela</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --primary: #8b5cf6;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
        }
        .container { max-width: 800px; margin: 4rem auto; padding: 2rem; background: rgba(30, 41, 59, 0.7); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(16px); }
        .candidate-card { background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.2s; }
        .candidate-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .candidate-info h3 { margin: 0 0 0.5rem 0; color: #fff; }
        .candidate-info p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
        .star-rating { color: #fbbf24; font-weight: 600; margin-top: 0.5rem; display: inline-block; }
        .btn-approve { background: var(--success); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-approve:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .badge-status { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .badge-pendente { background: rgba(245,158,11,0.2); color: #f59e0b; border: 1px solid rgba(245,158,11,0.4); }
        .badge-aprovado { background: rgba(16,185,129,0.2); color: #10b981; border: 1px solid rgba(16,185,129,0.4); }
        .badge-rejeitado { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">FazFreela</div>
        <div class="nav-links">
            <a th:href="@{/trabalhos}" class="nav-link">Encontrar Vagas</a>
            <a th:href="@{/meus-trabalhos}" class="nav-link">Meus Trabalhos</a>
            <a th:href="@{/perfil}" class="nav-link">Meu Perfil</a>
        </div>
    </nav>

    <div class="container">
        <h2>Candidatos para: <span th:text="${trabalho.titulo}">Vaga</span></h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Analise os profissionais interessados no seu projeto e escolha o melhor talento.</p>

        <div th:if="${candidaturas.empty}" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            <p>Nenhum freelancer se candidatou a esta vaga ainda.</p>
        </div>

        <div th:each="c : ${candidaturas}" class="candidate-card">
            <div class="candidate-info">
                <h3 th:text="${c.trabalhador.nome}">Nome do Freelancer</h3>
                <p>📍 <span th:text="${c.trabalhador.cidade} + ' - ' + ${c.trabalhador.estado}">Local</span></p>
                <div class="star-rating">
                    ⭐ <span th:text="${c.trabalhador.notaMedia != null ? c.trabalhador.notaMedia : 'Novo'}">4.8</span>
                    <span style="margin-left: 1rem; padding: 0.2rem 0.6rem; border-radius: 12px; background: rgba(139, 92, 246, 0.2); color: #c4b5fd; font-size: 0.85rem; border: 1px solid rgba(139, 92, 246, 0.4);">
                        🎯 Match: <span th:text="${c.matchScore != null ? c.matchScore + '%' : '0.0%'}">85.0%</span>
                    </span>
                </div>
            </div>
            <div class="candidate-action">
                <span th:if="${c.status != 'PENDENTE'}" class="badge-status" 
                      th:classappend="${c.status == 'APROVADO' ? 'badge-aprovado' : 'badge-rejeitado'}" 
                      th:text="${c.status}">STATUS</span>
                      
                <form th:if="${c.status == 'PENDENTE'}" th:action="@{/trabalhos/{id}/candidatos/{cId}/aprovar(id=${trabalho.id}, cId=${c.id})}" method="post" style="margin: 0;">
                    <button type="submit" class="btn-approve">✅ Aprovar</button>
                </form>
            </div>
        </div>
        
        <div style="margin-top: 2rem; text-align: center;">
            <a th:href="@{/meus-trabalhos}" style="color: var(--primary); text-decoration: none;">&larr; Voltar para Meus Trabalhos</a>
        </div>
    </div>
</body>
</html>
