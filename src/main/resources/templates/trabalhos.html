<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FazFreela - Vagas Disponíveis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
        }

        .navbar {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .header-section {
            text-align: center;
            margin-bottom: 4rem;
        }

        .header-section h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 800;
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-price {
            font-size: 2rem;
            font-weight: 800;
            color: #10b981;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .location {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-apply {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-apply:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <a href="/trabalhos" class="logo" style="text-decoration: none;">FazFreela</a>
            <span style="width: 1px; height: 24px; background: rgba(255,255,255,0.15); display: inline-block;"></span>
            <span style="font-weight: 600; color: #f8fafc; font-size: 0.95rem;">Olá, <span th:text="${session.nome}" style="color: #a78bfa;">Trabalhador</span> 👋</span>
        </div>
        <div class="nav-links" style="display: flex; align-items: center; gap: 1.5rem;">
            <a href="/trabalhos" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Vagas</a>
            <a href="/meus-trabalhos" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Meus Trabalhos</a>
            <a href="/perfil" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Meu Perfil</a>
            <a href="/logout" style="color: #f87171; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#f87171'">Sair</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Encontre seu próximo freela</h1>
            <p>Faça uma grana extra ajudando outras pessoas com suas habilidades.</p>
        </div>

        <div th:if="${erroURL}" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-weight: 600;" th:text="${erroURL}"></div>
        <div th:if="${erro}" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-weight: 600;" th:text="${erro}"></div>
        <div th:if="${sucessoURL}" style="background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #10b981; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-weight: 600;" th:text="${sucessoURL}"></div>

        <div class="filter-section" style="display: flex; gap: 1rem; margin-bottom: 2rem; background: var(--card-bg); padding: 1.5rem; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px);">
            <div style="flex: 1;">
                <label for="filtroEstado" style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Filtrar por Estado</label>
                <select id="filtroEstado" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #1e293b; color: white;">
                    <option value="">Todos os Estados</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label for="filtroCidade" style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Filtrar por Cidade</label>
                <select id="filtroCidade" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #1e293b; color: white;" disabled>
                    <option value="">Todas as Cidades</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div th:each="trabalho : ${trabalhos}" class="card" th:data-estado="${trabalho.estado}" th:data-cidade="${trabalho.cidade}" style="cursor: pointer;" th:onclick="'window.location.href=\'/trabalhos/detalhes/' + ${trabalho.id} + '\''">
                <div class="card-price">
                    R$ <span th:text="${trabalho.valor}"></span>
                </div>
                <h2 class="card-title" th:text="${trabalho.titulo}">Título</h2>
                <div style="font-size: 0.85rem; color: var(--primary); margin-bottom: 1rem; margin-top: 0.5rem; text-decoration: underline;">Ver Detalhes do Serviço</div>
                
                <div class="card-footer" onclick="event.stopPropagation()">
                    <div class="location">
                        📍 <span th:text="${trabalho.endereco != null && !trabalho.endereco.isEmpty() ? trabalho.endereco : (trabalho.cidade + ' - ' + trabalho.estado)}">Endereço</span>
                    </div>
                    <form th:action="@{/trabalhos/candidatar/{id}(id=${trabalho.id})}" method="post" style="margin: 0;">
                        <button type="submit" class="btn-apply" th:data-titulo="${trabalho.titulo}">
                            Candidatar-se
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const filtroEstado = document.getElementById('filtroEstado');
        const filtroCidade = document.getElementById('filtroCidade');
        const cards = document.querySelectorAll('.card');

        async function carregarEstados() {
            try {
                const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome');
                const estados = await response.json();
                
                estados.forEach(estado => {
                    const option = document.createElement('option');
                    option.value = estado.sigla; 
                    option.textContent = `${estado.nome} (${estado.sigla})`;
                    filtroEstado.appendChild(option);
                });
            } catch (error) {
                console.error('Erro ao carregar estados:', error);
            }
        }

        async function carregarCidades(uf) {
            filtroCidade.innerHTML = '<option value="">Carregando...</option>';
            filtroCidade.disabled = true;

            try {
                const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`);
                const cidades = await response.json();

                filtroCidade.innerHTML = '<option value="">Todas as Cidades</option>';
                cidades.forEach(cidade => {
                    const option = document.createElement('option');
                    option.value = cidade.nome;
                    option.textContent = cidade.nome;
                    filtroCidade.appendChild(option);
                });
                filtroCidade.disabled = false;
            } catch (error) {
                console.error('Erro ao carregar cidades:', error);
                filtroCidade.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        function filtrarCards() {
            const estadoSelecionado = filtroEstado.value;
            const cidadeSelecionada = filtroCidade.value;

            cards.forEach(card => {
                const cardEstado = card.getAttribute('data-estado');
                const cardCidade = card.getAttribute('data-cidade');

                let mostrar = true;

                if (estadoSelecionado && cardEstado !== estadoSelecionado) {
                    mostrar = false;
                }
                if (cidadeSelecionada && cardCidade !== cidadeSelecionada) {
                    mostrar = false;
                }

                if (mostrar) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        filtroEstado.addEventListener('change', (e) => {
            const uf = e.target.value;
            if (uf) {
                carregarCidades(uf);
            } else {
                filtroCidade.innerHTML = '<option value="">Todas as Cidades</option>';
                filtroCidade.disabled = true;
            }
            filtrarCards();
        });

        filtroCidade.addEventListener('change', filtrarCards);

        carregarEstados();
    </script>
</body>
</html>
