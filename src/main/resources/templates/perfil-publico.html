<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FazFreela - Perfil do Profissional</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .perfil-wrapper {
            max-width: 700px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .perfil-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 3rem;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .perfil-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            color: white;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }

        .perfil-nome {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #f8fafc;
        }

        .perfil-local {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin: 2rem 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f8fafc;
        }

        .stat-value.highlight-green {
            color: #10b981;
        }

        .stat-value.highlight-purple {
            color: #c4b5fd;
        }

        /* Tags de habilidades */
        .skills-container {
            text-align: left;
            margin-top: 1rem;
        }

        .skills-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tag:hover {
            background: rgba(139, 92, 246, 0.25);
            transform: translateY(-2px);
        }
        
        .empty-skills {
            color: #64748b;
            font-style: italic;
            font-size: 0.95rem;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 1.5rem;
            transition: color 0.3s;
        }
        
        .btn-voltar:hover {
            color: #c4b5fd;
        }

        .erro-box {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.4);
            color: #f87171;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .nav-icon-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .badge {
            position: absolute;
            top: -5px;
            right: -10px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 2rem;">
            <a href="/trabalhos" class="logo" style="text-decoration: none;">FazFreela</a>
        </div>
        <div class="nav-links" style="display: flex; align-items: center; gap: 1.5rem;">
            <a href="/notificacoes" class="nav-icon-container" style="color: #f8fafc; text-decoration: none; font-size: 1.2rem;">
                🔔 <span class="badge" id="nav-notificacoes-badge" style="display: none;">0</span>
            </a>
            <a href="/trabalhos" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Vagas</a>
            <a href="/meus-trabalhos" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Meus Trabalhos</a>
            <a href="/perfil" style="color: #94a3b8; text-decoration: none; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#94a3b8'">Meu Perfil</a>
        </div>
    </nav>

    <div class="perfil-wrapper">
        <a href="javascript:history.back()" class="btn-voltar">&larr; Voltar para as candidaturas</a>

        <div th:if="${erro}" class="erro-box" th:text="${erro}"></div>

        <div th:if="${usuario}" class="perfil-card">
            
            <div class="avatar" th:text="${#strings.substring(usuario.nome, 0, 1)}"></div>
            <div class="perfil-nome" th:text="${usuario.nome}">Nome do Usuário</div>
            <div class="perfil-local">
                📍 <span th:text="${usuario.cidade != null and usuario.cidade != '' ? usuario.cidade + ' - ' + usuario.estado : 'Localização não informada'}">Localização</span>
            </div>

            <hr class="divider">

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Avaliação Média</div>
                    <div class="stat-value highlight-green">
                        ⭐ <span th:text="${usuario.notaMedia != null and usuario.notaMedia > 0} ? ${#numbers.formatDecimal(usuario.notaMedia, 1, 1)} : 'Novo'">Novo</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pretensão (Valor/Hora)</div>
                    <div class="stat-value highlight-purple">
                        <span th:if="${usuario.pretensaoValorHora != null and usuario.pretensaoValorHora > 0}">R$ <span th:text="${#numbers.formatDecimal(usuario.pretensaoValorHora, 1, 'POINT', 2, 'COMMA')}"></span></span>
                        <span th:unless="${usuario.pretensaoValorHora != null and usuario.pretensaoValorHora > 0}" style="font-size: 1.2rem; color: #94a3b8;">A combinar</span>
                    </div>
                </div>
            </div>

            <div class="skills-container">
                <div class="skills-title">🛠️ Qualificações e Habilidades</div>
                
                <!-- Mostra as tags se existirem -->
                <div class="tags-list" th:if="${usuario.habilidades != null and !usuario.habilidades.isEmpty()}">
                    <span class="tag" th:each="hab : ${#strings.arraySplit(usuario.habilidades, ',')}" th:text="${hab.trim()}">Habilidade</span>
                </div>
                
                <!-- Mostra mensagem se não houver tags -->
                <div class="empty-skills" th:if="${usuario.habilidades == null or usuario.habilidades.isEmpty()}">
                    Este profissional ainda não adicionou habilidades ao perfil.
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/notificacoes/count')
                .then(response => response.json())
                .then(count => {
                    if (count > 0) {
                        const badge = document.getElementById('nav-notificacoes-badge');
                        badge.innerText = count;
                        badge.style.display = 'block';
                    }
                })
                .catch(error => console.error("Erro ao carregar notificações", error));
        });
    </script>
</body>
</html>
