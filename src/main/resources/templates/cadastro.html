<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FazFreela - Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">FazFreela</a>
        <div class="nav-links">
            <a href="/login">Entrar</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h1 class="auth-title">Crie sua Conta</h1>
            <p class="auth-subtitle">Junte-se ao FazFreela e encontre oportunidades.</p>

            <div th:if="${erro}" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; font-weight: 600;" th:text="${erro}"></div>

            <form th:action="@{/cadastro}" method="POST">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" th:value="${nome}" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" th:value="${email}" required>
                </div>
                

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" minlength="8" required>
                    <small style="color: #a0aec0; font-size: 0.78rem; margin-top: 0.3rem; display: block;">
                        Mínimo 8 caracteres, com pelo menos 1 número e 1 símbolo (ex: !@#$)
                    </small>
                </div>

                <div class="input-group">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" minlength="8" required>
                </div>

                <button type="submit" class="btn-primary">Criar Conta</button>
            </form>

            <div class="auth-links">
                Já tem uma conta? <a href="/login">Faça Login</a>
            </div>
        </div>
    </div>

</body>
</html>
